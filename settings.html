<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="tailwind.config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Privacy & Settings - Lost & Found</title>
</head>

<body class="bg-background-light min-h-screen font-display">

    <!-- HEADER / NAVBAR -->
    <header
        class="p-4 sm:px-6 flex justify-between items-center bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
        <div class="flex items-center space-x-2">
            <span class="font-bold text-xl text-portal">Lost and Found Portal</span>
        </div>
        <nav class="flex items-center space-x-6">
            <a class="text-home hover:text-home-hover font-medium" href="index.html">Home</a>
            <a class="text-create-post hover:text-create-post-hover font-medium" href="report_form.html">Create a Post</a>
            <a class="text-slate-600 hover:text-primary font-medium" href="profile.html">Profile</a>
            <a class="text-primary font-semibold" href="settings.html">Settings</a>
        </nav>
    </header>

    <!-- SETTINGS CONTAINER -->
    <main class="max-w-xl mx-auto p-4 sm:p-6 mt-6 space-y-6">
        <h1 class="text-2xl font-bold text-slate-800">Privacy & Settings</h1>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-6">

            <!-- Account Email Section -->
            <div class="space-y-1">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Account Email</label>
                <p id="settings-email"
                    class="text-slate-800 font-medium text-base bg-slate-50 px-4 py-2.5 rounded-lg border border-slate-200">
                    Loading email...</p>
            </div>

            <hr class="border-slate-100">

            <!-- Password Reset Section -->
            <div class="space-y-3">
                <h3 class="text-sm font-bold text-slate-800">Password Management</h3>
                <p class="text-xs text-slate-500">Need to update your password? Click below and we will send a secure
                    password reset link to your registered email address.</p>
                <button id="reset-password-btn" type="button"
                    class="px-4 py-2.5 bg-primary/10 text-primary hover:bg-primary/20 font-medium rounded-lg text-sm transition-colors cursor-pointer">
                    Send Password Reset Email
                </button>
                <p id="reset-msg" class="text-xs font-medium hidden mt-2"></p>
            </div>
        </div>
    </main>

    <!-- FIREBASE & SETTINGS LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJuZdbS3vK9stg0lIgmYAM3KQnPhPjhA4",
            authDomain: "lost-andfound-8f654.firebaseapp.com",
            projectId: "lost-andfound-8f654",
            storageBucket: "lost-andfound-8f654.firebasestorage.app",
            messagingSenderId: "1053006563820",
            appId: "1:1053006563820:web:9041225d6f4730242458c9",
            measurementId: "G-BX4ZNYP9H5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            document.getElementById('settings-email').innerText = user.email;
        });

        document.getElementById('reset-password-btn').addEventListener('click', async () => {
            const msgEl = document.getElementById('reset-msg');
            msgEl.classList.remove('hidden');

            try {
                const user = auth.currentUser;
                if (!user || !user.email) throw new Error("No user session found.");

                await sendPasswordResetEmail(auth, user.email);
                msgEl.className = "text-xs text-green-600 font-medium mt-2";
                msgEl.innerText = "Password reset email sent successfully! Check your inbox.";
            } catch (err) {
                msgEl.className = "text-xs text-red-500 font-medium mt-2";
                msgEl.innerText = err.message.replace("Firebase: ", "");
            }
        });
    </script>
</body>

</html>
